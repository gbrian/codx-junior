[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-image-cli"
version = "0.1.0"
description = "A CPU-optimized CLI tool for text-image-to-image editing using InstructPix2Pix"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Developer", email = "developer@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies - specify base versions without platform-specific variants
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "diffusers>=0.30.0",
    "transformers>=4.40.0",
    "Pillow>=10.0.0",
    "accelerate>=0.33.0",
]

# This automatically registers your script as a global terminal command line tool
[project.scripts]
image-cli = "image_cli:main"

# Local repository management structure configurations
[tool.setuptools]
py-modules = ["image_cli"]