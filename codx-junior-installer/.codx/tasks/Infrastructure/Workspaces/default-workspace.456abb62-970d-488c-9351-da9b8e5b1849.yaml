- content: "To add the `code-server` and `webtop debian-kde` services to the `docker-compose.workspace-demo.yaml`\
    \ file and mount the `./projects` folder, we will need to modify the file accordingly.\
    \ Here's how you can do it:\n\n```yaml /shared/codx-junior-demo/docker-compose.workspace-demo.yaml\n\
    services:\n  code-server:\n    image: codercom/code-server\n    volumes:\n   \
    \   - ./projects:/home/coder/projects\n    ports:\n      - \"8080:8080\"\n   \
    \ environment:\n      PASSWORD: \"yourpassword\"\n\n  webtop:\n    image: ghcr.io/linuxserver/webtop:debian-kde\n\
    \    volumes:\n      - ./projects:/home/projects\n    ports:\n      - \"3000:3000\"\
    \n    environment:\n      - PUID=1000\n      - PGID=1000\n```\n\nIn this setup:\n\
    - The `code-server` service uses the `codercom/code-server` image and mounts the\
    \ `./projects` directory to `/home/coder/projects` inside the container. It also\
    \ maps port 8080 on the host to port 8080 in the container.\n- The `webtop` service\
    \ uses the `ghcr.io/linuxserver/webtop:debian-kde` image and mounts the `./projects`\
    \ directory to `/home/projects` inside the container. It maps port 3000 on the\
    \ host to port 3000 in the container.\n- Ensure that the password for `code-server`\
    \ is set appropriately in the environment variables. You might want to change\
    \ `\"yourpassword\"` to a more secure password.\n\nThese changes will add the\
    \ required services to your Docker Compose setup."
