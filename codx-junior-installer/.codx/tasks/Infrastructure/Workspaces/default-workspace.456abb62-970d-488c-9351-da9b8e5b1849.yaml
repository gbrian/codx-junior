- content: "To allow websocket connections in the webtop \"preview\" service, you\
    \ need to modify the Traefik labels in your `docker-compose.workspace-default.yaml`\
    \ file. Specifically, you'll add labels to support websocket forwarding. Here's\
    \ the updated configuration for the `webtop` service:\n\n```yaml /shared/codx-junior-demo/projects/workspaces/docker-compose.workspace-default.yaml\n\
    services:\n  code-server:\n    image: codercom/code-server:latest\n    container_name:\
    \ workspace-default-coder\n    volumes:\n      - ./projects:/home/projects\n \
    \   env_file:\n      - .env\n    command: --auth none\n    user: \"${USER_ID}:${GROUP_ID}\"\
    \       \n    labels:\n      - \"traefik.http.routers.workspace-default-coder.rule=PathPrefix(`/coder`)\"\
    \n      - \"traefik.http.routers.workspace-default-coder.middlewares=workspace-default-coder-stripprefix\"\
    \n      - \"traefik.http.middlewares.workspace-default-coder-stripprefix.stripprefix.prefixes=/coder\"\
    \n    networks:\n      - codx-junior-demo\n\n  webtop:\n    image: ghcr.io/linuxserver/webtop:debian-kde\n\
    \    container_name: workspace-default-webtop\n    volumes:\n      - ./projects:/home/projects\n\
    \    env_file:\n      - .env\n    # ports:\n    #   - \"3000:3000\"\n    environment:\n\
    \      - PUID=${USER_ID}\n      - PGID=${GROUP_ID}\n    labels:\n      - \"traefik.http.routers.workspace-default-webtop.rule=PathPrefix(`/preview`)\"\
    \n      - \"traefik.http.routers.workspace-default-webtop.middlewares=workspace-default-webtop-stripprefix\"\
    \n      - \"traefik.http.middlewares.workspace-default-webtop-stripprefix.stripprefix.prefixes=/preview\"\
    \n      - \"traefik.http.routers.workspace-default-webtop.tls=true\"\n      -\
    \ \"traefik.http.routers.workspace-default-webtop.entrypoints=web\"\n      - \"\
    traefik.http.services.workspace-default-webtop.loadbalancer.server.port=3000\"\
    \n      - \"traefik.http.routers.workspace-default-webtop.service=workspace-default-webtop\"\
    \n      - \"traefik.http.routers.workspace-default-webtop-websocket.rule=PathPrefix(`/preview`)\"\
    \n      - \"traefik.http.routers.workspace-default-webtop-websocket.entrypoints=web\"\
    \n      - \"traefik.http.routers.workspace-default-webtop-websocket.service=workspace-default-webtop\"\
    \n      - \"traefik.http.routers.workspace-default-webtop-websocket.tls=true\"\
    \n      - \"traefik.http.routers.workspace-default-webtop-websocket.middlewares=workspace-default-webtop-stripprefix\"\
    \n      - \"traefik.http.services.workspace-default-webtop.loadbalancer.server.scheme=http\"\
    \n      \n    networks:\n      - codx-junior-demo\n\nnetworks:\n  codx-junior-demo:\n\
    \    external: true\n    name: codx-junior-demo\n```\n\nIn this configuration,\
    \ additional labels have been added to handle websocket connections. These include\
    \ defining a separate router for websockets (`workspace-default-webtop-websocket`)\
    \ with similar rules and middlewares as the main HTTP router."
