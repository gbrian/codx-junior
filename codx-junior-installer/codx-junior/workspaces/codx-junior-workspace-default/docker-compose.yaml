services:
  codx-junior-default:
    #####################################################################################
    ##
    ## NOTE: codx-junior-auth@file
    ##
    ## Use codx-junior-auth middleware to secure the workspace endpoints
    #####################################################################################
    # Kasm Ubuntu Noble desktop (KasmVNC) with VSCodium pre-installed, see ./Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    image: codxjunior/codx-junior-default-workspace:latest
    container_name: codx-junior-default-workspace
    restart: unless-stopped
    shm_size: '512m'
    volumes:
      - /home/codx-junior/codx-junior:/home/codx-junior/codx-junior # TODO: remove
      # Projects volume mapping
      - /home/codx-junior-projects:/home/codx-junior-projects
      # Persist VSCodium settings and extensions across container re-creation
      - codx-junior-desktop-config:/home/kasm-user/.config/VSCodium
      - codx-junior-desktop-extensions:/home/kasm-user/.vscode-oss
      # Access docker
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ./.workspace.env
    environment:
      - VNC_PW=${VNC_PW:-password}
      - VNC_RESOLUTION=${VNC_RESOLUTION:-1920x1080}
      - VNCOPTIONS=-disableBasicAuth
    
    labels:
      - traefik.enable=true

      #####################################################################################
      ## HTTP router (for use behind codx-junior's own proxy)
      #####################################################################################
      - traefik.http.routers.codx-junior-default-workspace-preview-router.rule=Host(`${CODX_JUNIOR_DOMAIN}`) && PathPrefix(`/workspace-default/preview`)
      - traefik.http.routers.codx-junior-default-workspace-preview-router.entrypoints=web
      - traefik.http.routers.codx-junior-default-workspace-preview-router.service=codx-junior-default-workspace-preview-service
      - traefik.http.routers.codx-junior-default-workspace-preview-router.middlewares=codx-junior-default-workspace-desktop-slash,codx-junior-default-workspace-desktop-regex,codx-junior-default-workspace-desktop-headers,codx-junior-auth

      #####################################################################################
      ## HTTPS router (for standalone access with TLS termination)
      #####################################################################################
      - traefik.http.routers.codx-junior-default-workspace-preview-secure-router.rule=Host(`${CODX_JUNIOR_DOMAIN}`) && PathPrefix(`/workspace-default/preview`)
      - traefik.http.routers.codx-junior-default-workspace-preview-secure-router.entrypoints=websecure
      - traefik.http.routers.codx-junior-default-workspace-preview-secure-router.tls.certresolver=sslresolver
      - traefik.http.routers.codx-junior-default-workspace-preview-secure-router.service=codx-junior-default-workspace-preview-service
      - traefik.http.routers.codx-junior-default-workspace-preview-secure-router.middlewares=codx-junior-default-workspace-desktop-slash,codx-junior-default-workspace-desktop-regex,codx-junior-default-workspace-desktop-headers,codx-junior-auth

      #####################################################################################
      ## Middlewares
      #####################################################################################
      # 1. Trailing Slash Enforcement
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-slash.replacepathregex.regex=^/workspace-default/preview$$
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-slash.replacepathregex.replacement=/workspace-default/preview/

      # 2. Path Rewrite mapping
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-regex.replacepathregex.regex=^/workspace-default/preview/(.*)
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-regex.replacepathregex.replacement=/$$1

      # 3. Streamlined Headers handling (WebSockets + Buffer Optimization)
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-headers.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-headers.headers.customrequestheaders.Connection=Upgrade
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-headers.headers.customrequestheaders.Upgrade=websocket
      
      # Crucial: Delete the Referer header to aggressively compress the HTTP header block size below KasmVNC's crash limit
      - traefik.http.middlewares.codx-junior-default-workspace-desktop-headers.headers.customrequestheaders.Referer=""

      #####################################################################################
      ## Shared Load Balancer Service (Configured for Self-Signed HTTPS)
      #####################################################################################
      - traefik.http.services.codx-junior-default-workspace-preview-service.loadbalancer.server.port=6901
      - traefik.http.services.codx-junior-default-workspace-preview-service.loadbalancer.server.scheme=https
      - traefik.http.services.codx-junior-default-workspace-preview-service.loadbalancer.serversTransport=insecure-skip-verify@file

    networks:
      - codx-junior

  codx-junior-coder:
    #####################################################################################
    ## LinuxServer VSCodium Web → /workspace-default/coder/
    #####################################################################################
    image: lscr.io/linuxserver/vscodium-web:latest
    container_name: codx-junior-default-workspace-coder
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # LinuxServer image passes direct binary flags via the CODE_ARGS env array
      - CODE_ARGS=--without-connection-token --server-base-path=/workspace-default/coder
    volumes:
      # LinuxServer relies on /config for internal app data, settings, and extensions
      - ./kasm-user/.vscode-server:/config
      - /home/codx-junior-projects:/home/codx-junior-projects
    labels:
      - "traefik.enable=true"

      #####################################################################################
      ## HTTPS router (Isolates TLS Termination from structural middleware conflicts)
      #####################################################################################
      # FIX: Enclose the entire value in double quotes, keeping backticks around the variable interpolation
      - "traefik.http.routers.codx-junior-default-workspace-coder-secure-router.rule=Host(`${CODX_JUNIOR_DOMAIN}`) && (Path(`/workspace-default/coder`) || PathPrefix(`/workspace-default/coder/`))"
      - "traefik.http.routers.codx-junior-default-workspace-coder-secure-router.entrypoints=websecure"
      - "traefik.http.routers.codx-junior-default-workspace-coder-secure-router.tls=true"
      - "traefik.http.routers.codx-junior-default-workspace-coder-secure-router.service=codx-junior-default-workspace-coder-service"
      - "traefik.http.routers.codx-junior-default-workspace-coder-secure-router.priority=300"

      #####################################################################################
      ## Shared load balancer service (LinuxServer internal port is 8000)
      #####################################################################################
      - "traefik.http.services.codx-junior-default-workspace-coder-service.loadbalancer.server.port=8000"

    networks:
      - codx-junior


  codx-junior-docs:
    image: node:22-alpine
    container_name: codx-junior-docs
    restart: unless-stopped
    volumes:
      - /home/codx-junior/codx-junior/docs:/app
    working_dir: /app
    command: sh -c "npm i && npm run docs:dev -- --host 0.0.0.0 --base /workspace-default/docs/"
    labels:
      - traefik.enable=true
      - traefik.http.routers.codx-junior-default-workspace-docs-router.rule=PathPrefix(`/workspace-default/docs`)
      - traefik.http.routers.codx-junior-default-workspace-docs-router.service=codx-junior-default-workspace-docs-service
      - traefik.http.routers.codx-junior-default-workspace-docs-router.middlewares=codx-junior-auth
      - traefik.http.services.codx-junior-default-workspace-docs-service.loadbalancer.server.port=5173
      - traefik.http.services.codx-junior-default-workspace-docs-service.loadbalancer.server.scheme=http
    networks:
      - codx-junior

volumes:
  codx-junior-desktop-config:
  codx-junior-desktop-extensions:
  codx-junior-coder-data:

networks:
  codx-junior:
    name: codx-junior_default
    external: true