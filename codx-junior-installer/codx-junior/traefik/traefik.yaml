entrypoints:
  web:
    address: :80
    observability:
      accessLogs: true
      metrics: true
      tracing: true

  websecure:
    address: :443
    observability:
      accessLogs: true
      metrics: true
      tracing: true

api:
  dashboard: true
  insecure: false # Must be false to set basePath 
  basePath: /traefik

log:
  level: DEBUG
  
accessLog:
  addInternals: true
  format: json
  fields:
    headers:
      defaultMode: keep

providers:
  # codx-junior's Traefik HTTP provider. The API publishes workspace
  # external-URL routes and the custom rules defined in the Traefik settings
  # tabs. Use the internal Docker service name: the public domain may not
  # resolve or expose the API port from inside this container.
  http:
    endpoint: "http://codx-junior-api:19980/api/traefik/config"
    pollInterval: "10s"
    pollTimeout: "5s"
  file:
    directory: /config/routes
    watch: true
  docker: {}
      
certificatesResolvers:
  sslresolver:
    acme:
      storage: "/config/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web