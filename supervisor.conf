; ============================================================================
; codx-junior — supervisord configuration
; ============================================================================
; Started by `bash codx-junior supervisor` (entrypoint.sh of the monolithic
; deployment). Every harness process is supervised with autorestart: when the
; API, the API background worker or the web client dies (crash, OOM, kill),
; supervisord brings it back with a bounded number of retries.
;
; The background worker owns the durable orchestration runtime; its runs are
; persisted on disk and recovered on restart, so a restart resumes in-flight
; work instead of losing it. The in-process harness watchdog (API process)
; additionally restarts `codx-junior-api-background` when it stalls with
; active runs (see codx/junior/harness/watchdog.py).
;
; Environment variables CODX_JUNIOR_PATH and CODX_SUPERVISOR_LOG_FOLDER are
; exported by set_env.sh before supervisord starts.
; ============================================================================

[unix_http_server]
file=/tmp/codx-junior-supervisor.sock

[supervisord]
logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/codx-junior-supervisord.pid
nodaemon=false
minfds=1024
minprocs=200
childlogdir=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/codx-junior-supervisor.sock

; ----------------------------------------------------------------------------
; codx-junior API (user-facing, port 19980)
; ----------------------------------------------------------------------------
[program:codx-junior-api]
command=bash -lc "bash %(ENV_CODX_JUNIOR_PATH)s/scripts/run_api.sh"
directory=%(ENV_CODX_JUNIOR_PATH)s
environment=CODX_JUNIOR_API_BACKGROUND=""
autostart=true
autorestart=true
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/codx-junior-api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; ----------------------------------------------------------------------------
; codx-junior API background (orchestration worker, watchers, port 19984)
; ----------------------------------------------------------------------------
[program:codx-junior-api-background]
command=bash -lc "bash %(ENV_CODX_JUNIOR_PATH)s/scripts/run_api.sh"
directory=%(ENV_CODX_JUNIOR_PATH)s
environment=CODX_JUNIOR_API_BACKGROUND="1"
autostart=true
autorestart=true
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/codx-junior-api-background.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

; ----------------------------------------------------------------------------
; codx-junior web client (port 19981)
; ----------------------------------------------------------------------------
[program:codx-junior-client]
command=bash -lc "bash %(ENV_CODX_JUNIOR_PATH)s/scripts/run_client.sh"
directory=%(ENV_CODX_JUNIOR_PATH)s
autostart=true
autorestart=true
startsecs=10
startretries=20
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(ENV_CODX_SUPERVISOR_LOG_FOLDER)s/codx-junior-web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
