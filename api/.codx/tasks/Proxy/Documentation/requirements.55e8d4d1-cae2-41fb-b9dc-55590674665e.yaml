- content: "Platform must be able to create workspaces. A workspace is defined be\
    \ one or more tools accessible by web.\nWoekspaces must be isolated from each\
    \ other.\nWorkspaces will be defined using a docker-compose file.\nAll apps in\
    \ the workspace must be accessed by its own http or tcp port.\nMultiple workspaces\
    \ can use same ports so we must ensure we can route requests to the right port.\n\
    \nWe must discuss:\n * Structure to manage workspaces: data, crud operations\n\
    \ * Workspaces setup (will be using docker)\n * Workspaces routing and user permissions"
