[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "codx-junior"
version = "0.1.0"
description = "Your AI coding assistant"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
  'openai>=2.24.0',
  'langchain>=1.1.0',
  'langchain-community>=0.4.1',
  'langchain-text-splitters>=1.0.0',
  'flask>=2.0.2',
  'python-slugify>=8.0.1',
  'llama-index>=0.9.42',
  'uvicorn>=0.38.0',
  'fastapi_socketio>=0.0.10',
  'fastapi>=0.122.0',
  'python-multipart>=0.0.20',
  'pytesseract',
  'pillow',
  'beautifulsoup4',
  'markdownify',
  'pymilvus>=2.4.0',
  'watchfiles>=1.0.4',
  'pyjwt>=2.10.1',
  'bcrypt>=4.3.0',
  'ffmpeg>=1.4',
  'aiofiles>=24.1.0',
  'html2text',
  'watchdog',
  'pypandoc>=1.16',
  'jinja2>=3.0.3',
  'vllm>=0.5.0',
  'sentence-transformers>=5.6.0',
  'torch>=2.4.0', 
  'pathspec>=1.1.1',
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = [
    "pytest >= 7.3.1",
]
doc = [
]

[project.scripts]
codx-junior = 'codx.app:app'

[tool.setuptools]
packages = ["codx"]

[tool.ruff]
select = ["F", "E", "W", "I001"]
line-length = 100
target-version = "py311"

[project.urls]
"Homepage" = "https://github.com"
"Bug Tracker" = "https://github.com"

# --- UV-SPECIFIC CONFIGURATION ---

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
