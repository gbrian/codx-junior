- content: "```js\n// Assuming the decorator is to be used externally\nfunction getArgs(func)\
    \ { \n  return function(args) {\n    const newArgs = { ...args, project: args.project\
    \ || $projects.activeProject };\n    return func.call(this, newArgs);\n  };\n\
    }\n\nexport default function Navigate({ $router, $storex }) {\n  const routes\
    \ = { \n    kanban: {\n      board({ project: { project_name }, board }) {\n \
    \       return `/${project_name}/kanban/${board}`\n      }\n    }\n  }\n\n  const\
    \ { \n    projects: $projects, \n    ui: $ui \n  } = $storex.projects\n\n  const\
    \ $navigator = {\n    get activeProject() {\n      return $projects.activeProject\n\
    \    },\n    async onRouteChanged({ from, to, next }) {\n      if (to.path.startsWith(\"\
    /auth\")) {\n        const { code, state } = to.query\n        const provider\
    \ = to.path.split(\"/\").reverse()[0]\n\n        if (!provider || !code) {\n \
    \         $storex.session.onError(\"Missing OAuth provider or code\");\n     \
    \     return next('/');\n        }\n\n        try {\n          await $storex.users.oauthLogin({\
    \ provider, code, state });\n          next('/');\n        } catch (error) {\n\
    \          $storex.session.onError(\"Failed to complete OAuth login\");\n    \
    \      next('/');\n        }\n      } else {\n        next()\n      }\n    },\n\
    \    kanban: {\n      board: getArgs(async function(args) {\n        const { project,\
    \ board } = args;\n        if (project !== $navigator.activeProject) {\n     \
    \     await $projects.setActiveProject(project);\n        }\n        $projects.setActiveBoard(board);\n\
    \        $ui.setActiveTab('tasks');\n        $router.push(routes.kanban.board(args));\n\
    \      })\n    }\n  }\n  return $navigator\n}\n```"
