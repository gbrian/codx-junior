- content: "To run a container with a different user ID or group without modifying\
    \ the way the container is built, you can override the user and group settings\
    \ at runtime. Here's how you can achieve that using Docker:\n\n1. **Run the container\
    \ with a specific user ID and group ID**:\n   You can specify the user and group\
    \ using the `--user` flag with `docker run`. Here's an example command:\n\n  \
    \ ```bash\n   docker run --user <UID>:<GID> <image>\n   ```\n\n   Replace `<UID>`\
    \ with the desired user ID and `<GID>` with the desired group ID, and `<image>`\
    \ with the name of your Docker image.\n\n2. **Update the \"codx-junior\" user\
    \ to match the specified UID and GID**:\n   If you need the \"codx-junior\" user\
    \ inside the container to have the specified UID and GID, you can achieve this\
    \ by executing a command inside the container at runtime to modify the user. Here\
    \ is an example:\n\n   ```bash\n   docker run --user <UID>:<GID> <image> bash\
    \ -c \"usermod -u <UID> codx-junior && groupmod -g <GID> codx-junior && exec your_command\"\
    \n   ```\n\n   Replace `your_command` with the command you want to execute inside\
    \ the container.\n\n3. **Use environment variables**:\n   If you have scripts\
    \ or applications inside the container that rely on environment variables for\
    \ the user or group, you can pass these environment variables at runtime:\n\n\
    \   ```bash\n   docker run --user <UID>:<GID> -e USER_ID=<UID> -e GROUP_ID=<GID>\
    \ <image>\n   ```\n\nThese methods allow you to run your container with the desired\
    \ user and group without needing to change the Dockerfile or the way the container\
    \ is built."
