- content: "```bash /shared/codx-junior/entrypoint.sh\n#!/bin/bash\necho \"codx-junior\
    \ entrypoint\"\nenv\n\n# Update codx-junior user ID and group ID to match the\
    \ current user\nCURRENT_UID=$(id -u)\nCURRENT_GID=$(id -g)\nusermod -u $CURRENT_UID\
    \ codx-junior\ngroupmod -g $CURRENT_GID codx-junior\n\n# Install\nif [ \"$1\"\
    \ == \"install\" ]; then\n  cd ${HOME}/codx-junior\n  echo \"Installing codx-junior\
    \ at ${HOME}/codx-junior\"\n  bash codx-junior install\n\n  exit\nfi\n\n# Run\n\
    if [ -f /user-entrypoint.sh ]; then\n  . /user-entrypoint.sh\nfi\n\n# Run supervisor\n\
    echo \"Entrypoint: running supervisor\"\nsudo -E bash -c \"bash ${HOME}/codx-junior/codx-junior\
    \ supervisor\"\n```"
