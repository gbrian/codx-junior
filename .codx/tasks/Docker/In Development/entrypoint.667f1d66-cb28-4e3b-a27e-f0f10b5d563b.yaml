- content: "```bash /shared/codx-junior/entrypoint.sh\n#!/bin/bash\necho \"codx-junior\
    \ entrypoint\"\nenv\n\n# Ensure the current user exists in the passwd database\
    \ to avoid errors with sudo\nif ! id -u &>/dev/null; then\n  echo \"Current user\
    \ does not exist, adding to the passwd database\"\n  echo \"$(whoami):x:$(id -u):$(id\
    \ -g):,,,:/home/$(whoami):/bin/bash\" >> /etc/passwd\nfi\n\n# Update codx-junior\
    \ user ID and group ID to match the current user\nCURRENT_UID=$(id -u)\nCURRENT_GID=$(id\
    \ -g)\nusermod -u $CURRENT_UID codx-junior\ngroupmod -g $CURRENT_GID codx-junior\n\
    \n# Install\nif [ \"$1\" == \"install\" ]; then\n  cd ${HOME}/codx-junior\n  echo\
    \ \"Installing codx-junior at ${HOME}/codx-junior\"\n  bash codx-junior install\n\
    \n  exit\nfi\n\n# Run\nif [ -f /user-entrypoint.sh ]; then\n  . /user-entrypoint.sh\n\
    fi\n\n# Run supervisor\necho \"Entrypoint: running supervisor\"\nsudo -E bash\
    \ -c \"bash ${HOME}/codx-junior/codx-junior supervisor\"\n```"
