    /{data.split('_')[0]}\"\n        conn = requests.get(\n                endpoint=endpoint,\n\
    \                headers={\"Authorization\": f\"Bearer {self._oolama.token}\"\
    },\n                json=self._encode_data(data).json()\n        )\n        \n\
    \        return conn.json()\n\n    def _process_input(self, input):\n        \"\
    \"\"Process a single line of input.\"\"\"\n        line, rest = input.split(':\
