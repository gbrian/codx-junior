- content: "How can we store user data encrypted and decrypt when needed?\n      \
    \  \nThis is a client (javascript) server (python) app and we need to store a\
    \ key when user creates or updates its account.\nDuring server processes we need\
    \ to use that key so we have to decrypt.\n        \nThe complexity is this is\
    \ a shared dev environment where multipe users can access to the data so the decryption\
    \ process can't depend on server stored keypass or similar and it's not a good\
    \ idea to ask user to always send passkey every time we need to decrypt.\n   \
    \     \nTell me approches to allow multiple users to stores their private data\
    \ in a secure way so other users can't decrypt it"
